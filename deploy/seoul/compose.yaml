name: himalaya-seoul-reader

x-runtime: &runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "3"

services:
  proxy:
    <<: *runtime
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    network_mode: host
    user: "${READER_PROXY_UID:?set reader service uid}:${READER_PROXY_GID:?set reader service gid}"
    tmpfs:
      - /config:mode=1777
      - /data:mode=1777
      - /tmp:mode=1777
    environment:
      READER_HOST: ${READER_HOST:?set the dedicated HTTPS reader hostname}
      READER_PROXY_PORT: ${READER_PROXY_PORT:-18080}
    volumes:
      - type: bind
        source: ${READER_SOCKET_DIR:-/run/himalaya-mail-reader}
        target: /run/himalaya-mail-reader
        read_only: true
        bind:
          create_host_path: false
      - auth-socket:/run/himalaya-auth:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - authelia
  authelia:
    <<: *runtime
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "grep -Eq ' 00010000 .* /run/himalaya-auth/auth.sock$$' /proc/net/unix"]
    command: [authelia, --config, /etc/authelia/reader.yml, --config.experimental.filters=template]
    environment:
      READER_HOST: ${READER_HOST:?set the dedicated HTTPS reader hostname}
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage
    volumes:
      - auth-socket:/run/himalaya-auth
      - ./authelia.yml:/etc/authelia/reader.yml:ro
      - ${READER_AUTH_DIR:?set an absolute private directory}/users.yml:/etc/authelia/users.yml:ro
      - auth-state:/config
    secrets:
      - session
      - storage
    networks:
      - sessions
    restart: unless-stopped
    depends_on:
      - redis
  redis:
    <<: *runtime
    image: redis:8.4.8-alpine@sha256:ff72f74e4f471df79ed920aa8bbc35efe72ff8a1f8acdc50aad5dbb9b14a4034
    user: "999:1000"
    command: [redis-server, --protected-mode, "no", --save, "", --appendonly, "yes", --appendfsync, always]
    volumes:
      - session-state:/data
    networks:
      - sessions
    restart: unless-stopped

networks:
  sessions:
    internal: true

volumes:
  auth-socket:
  auth-state:
  session-state:

secrets:
  session:
    file: ${READER_AUTH_DIR:?set an absolute private directory}/session
  storage:
    file: ${READER_AUTH_DIR:?set an absolute private directory}/storage
