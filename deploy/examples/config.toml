[accounts.imap-smtp]
default = true
email = "alice@example.invalid"
imap.server = "imap.example.invalid"
imap.sasl.plain.username = "alice@example.invalid"
imap.sasl.plain.password.command = ["cat", "/run/secrets/imap_password"]
smtp.server = "smtp.example.invalid"
smtp.sasl.plain.username = "alice@example.invalid"
smtp.sasl.plain.password.command = ["cat", "/run/secrets/smtp_password"]

